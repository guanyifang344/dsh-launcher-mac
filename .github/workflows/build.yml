name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release

      - name: Run unit tests
        run: swift run DshShellCoreTests

  release:
    name: Build Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write   # 创建 Release + 上传产物需要写权限（默认 GITHUB_TOKEN 为只读）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整 tag 历史以解析版本号

      - name: Build release artifacts (ZIP + DMG + SHA256)
        run: bash scripts/build-release.sh

      - name: Extract release notes from CHANGELOG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          echo "--- release notes ---"
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
